<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX Table Generator</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header>
    <h1>Generador de Tablas para <span>Overleaf</span></h1>
    <p>Edita una tabla → Código listo para pegar en Overleaf</p>
  </header>

  <main>
    <!-- LEFT PANEL -->
    <div class="left-panel">

      <!-- Paste zone -->
      <div class="paste-zone">
        <label>(Opcional) Pegar CSV / Excel / LaTeX</label>
        <textarea id="paste-input" placeholder="Pega aquí datos: CSV/Excel, código \tabla{...}{...}{...}{...} o \begin{tabular|longtable}…"
          spellcheck="false"></textarea>
        <button class="btn primary" onclick="importPaste()">Importar</button>
      </div>

      <!-- Ribbon: tabs + panes -->
      <div class="ribbon">
        <div class="ribbon-tabs">
          <button class="ribbon-tab active" data-tab="tabla" onclick="switchTab('tabla')">Tabla</button>
          <button class="ribbon-tab" data-tab="columnas" onclick="switchTab('columnas')">Columnas</button>
          <button class="ribbon-tab" data-tab="cabecera" onclick="switchTab('cabecera')">Cabecera</button>
          <button class="ribbon-tab" data-tab="celdas" onclick="switchTab('celdas')">Color celdas</button>
          <button class="ribbon-tab" data-tab="zebra" onclick="switchTab('zebra')">Filas alternas</button>
        </div>

        <!-- Pane: Tabla (estructura) -->
        <div class="ribbon-pane active" data-pane="tabla">
          <button class="btn" onclick="addRow()">＋ Añadir fila</button>
          <button class="btn danger" onclick="delLastRow()">－ Eliminar fila</button>
          <div class="sep"></div>
          <button class="btn" onclick="addCol()">＋ Añadir columna</button>
          <button class="btn danger" onclick="delLastCol()">－ Eliminar columna</button>
          <div class="sep"></div>
          <button class="btn" id="merge-btn" onclick="mergeSelection()" title="Selecciona un rango arrastrando y combina en una sola celda" disabled>⊞ Combinar</button>
          <button class="btn" id="split-btn" onclick="splitSelection()" title="Divide la combinación del rango seleccionado" disabled>⊟ Dividir</button>
          <div class="sep"></div>
          <button class="btn" onclick="resetTable()" title="Tabla en blanco: cabecera + 3×3">↺ Resetear</button>
          <button class="btn danger" onclick="clearAll()">✕ Limpiar todo</button>
        </div>

        <!-- Pane: Columnas -->
        <div class="ribbon-pane" data-pane="columnas">
          <div class="opt-group">
            <label title="#2 — especificación de columnas generada automáticamente">Alineación</label>
            <select id="align-select" onchange="renderLatex()">
              <option value="l">l — Alinear a izquierda</option>
              <option value="c">c — Alinear a centro</option>
              <option value="r">r — Alinear a derecha</option>
              <option value="p{2cm}">p{2cm} — párrafo</option>
            </select>
          </div>
          <div class="sep"></div>
          <div class="opt-group">
            <label>Bordes vert.</label>
            <input type="checkbox" id="vborder" onchange="renderLatex()" checked>
          </div>
          <div class="opt-group">
            <label>Bordes horiz.</label>
            <input type="checkbox" id="hborder" onchange="renderLatex()" checked>
          </div>
          <div class="sep"></div>
          <div class="opt-group">
            <label title="Spec manual sobreescribe el selector">Personalizar</label>
            <input type="text" id="manual-spec" placeholder="ej. |l|c|r|" oninput="renderLatex()" style="width:130px">
          </div>
        </div>

        <!-- Pane: Cabecera -->
        <div class="ribbon-pane" data-pane="cabecera">
          <div class="opt-group">
            <label>Fondo de celda</label>
            <div class="color-select-wrap">
              <div class="color-swatch" id="cell-swatch"></div>
              <select id="cell-color-select" onchange="onSelectChange()"></select>
              <input type="number" class="opacity-input" id="cell-color-opacity" min="5" max="100" step="5" value="100" onchange="onSelectChange()" title="Opacidad (%) — xcolor !xx">
            </div>
          </div>
          <div class="sep"></div>
          <div class="opt-group">
            <label>Texto</label>
            <div class="color-select-wrap">
              <div class="color-swatch" id="text-swatch"></div>
              <select id="text-color-select" onchange="onSelectChange()"></select>
              <input type="number" class="opacity-input" id="text-color-opacity" min="5" max="100" step="5" value="100" onchange="onSelectChange()" title="Opacidad (%) — xcolor !xx">
            </div>
          </div>
          <div class="sep"></div>
          <div class="opt-group">
            <label>Negrita</label>
            <input type="checkbox" id="header-bold" checked onchange="renderLatex()">
          </div>
          <div class="sep"></div>
          <div class="header-cell-preview" id="header-cell-preview">Vista previa</div>
        </div>

        <!-- Pane: Color celdas (selección) -->
        <div class="ribbon-pane" data-pane="celdas">
          <div class="opt-group">
            <label>Fondo</label>
            <div class="color-select-wrap">
              <div class="color-swatch" id="cell-bg-swatch"></div>
              <select id="cell-bg-select" onchange="onCellColorChange()"></select>
              <input type="number" class="opacity-input" id="cell-bg-opacity" min="5" max="100" step="5" value="100" onchange="onCellColorChange()" title="Opacidad (%) — xcolor !xx">
            </div>
          </div>
          <div class="sep"></div>
          <div class="opt-group">
            <label>Texto</label>
            <div class="color-select-wrap">
              <div class="color-swatch" id="cell-fg-swatch"></div>
              <select id="cell-fg-select" onchange="onCellColorChange()"></select>
              <input type="number" class="opacity-input" id="cell-fg-opacity" min="5" max="100" step="5" value="100" onchange="onCellColorChange()" title="Opacidad (%) — xcolor !xx">
            </div>
          </div>
          <div class="sep"></div>
          <button class="btn" id="apply-color-btn" onclick="applyColorToSelection()" title="Aplica los colores elegidos a todas las celdas del rango seleccionado" disabled>Aplicar a selección</button>
          <button class="btn danger" id="clear-color-btn" onclick="clearColorFromSelection()" title="Quita el color personalizado de las celdas seleccionadas" disabled>Quitar color</button>
        </div>

        <!-- Pane: Filas alternas (zebra) -->
        <div class="ribbon-pane" data-pane="zebra">
          <div class="opt-group">
            <label>Activar</label>
            <input type="checkbox" id="alt-rows-enabled" onchange="onAltRowColorChange()">
          </div>
          <div class="sep"></div>
          <div class="opt-group">
            <label>Color 1</label>
            <div class="color-select-wrap">
              <div class="color-swatch" id="alt-color1-swatch"></div>
              <select id="alt-color1-select" onchange="onAltRowColorChange()"></select>
              <input type="number" class="opacity-input" id="alt-color1-opacity" min="5" max="100" step="5" value="20" onchange="onAltRowColorChange()" title="Opacidad (%) — xcolor !xx">
            </div>
          </div>
          <div class="sep"></div>
          <div class="opt-group">
            <label>Color 2</label>
            <div class="color-select-wrap">
              <div class="color-swatch" id="alt-color2-swatch"></div>
              <select id="alt-color2-select" onchange="onAltRowColorChange()"></select>
              <input type="number" class="opacity-input" id="alt-color2-opacity" min="5" max="100" step="5" value="100" onchange="onAltRowColorChange()" title="Opacidad (%) — xcolor !xx">
            </div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

  </main>

  <div class="bottom-panel">
    <div class="output-collapsible" id="output-collapsible">
      <div class="arg-legend">
        <div class="arg-pill" style="--c:var(--mono-orange)">#1 <span>nº cols</span></div>
        <div class="arg-pill" style="--c:var(--mono-blue)">#2 <span>col spec</span></div>
        <div class="arg-pill" style="--c:var(--mono-green)">#3 <span>cabecera</span></div>
        <div class="arg-pill" style="--c:#e07878">#4 <span>contenido</span></div>
      </div>
      <div id="latex-output"></div>
    </div>
    <div class="bottom-bar">
      <div class="status-info">
        <div>Filas: <span id="st-rows">0</span></div>
        <div>Columnas: <span id="st-cols">0</span></div>
        <div>Celdas: <span id="st-cells">0</span></div>
      </div>
      <span class="tabla-sig">\tabla{<span style="color:var(--mono-orange)">#1</span>}{<span
          style="color:var(--mono-blue)">#2</span>}{<span style="color:var(--mono-green)">#3</span>}{<span
          style="color:#e07878">#4</span>}</span>
      <div class="bottom-actions">
        <button class="copy-btn" id="macro-btn" onclick="copyMacro()">1. Copiar Macro</button>
        <button class="copy-btn" id="copy-btn" onclick="copyTable()">2. Copiar Tabla</button>
        <button class="toggle-btn" id="toggle-btn" onclick="toggleOutput()">▲ Ver código</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>

</html>
